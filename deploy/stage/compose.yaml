name: churchflow-stage

x-common: &common
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  api:
    <<: *common
    container_name: churchflow-stage-api
    image: ${API_IMAGE:?Set API_IMAGE to an immutable API image tag}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '4000'
    ports:
      - 127.0.0.1:4000:4000
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://127.0.0.1:4000/v1/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    <<: *common
    container_name: churchflow-stage-web
    image: ${WEB_IMAGE:?Set WEB_IMAGE to an immutable Web image tag}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://127.0.0.1:3000/'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
