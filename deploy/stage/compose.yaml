name: churchflow-stage

x-common: &common
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'

services:
  api:
    <<: *common
    container_name: churchflow-stage-api
    image: ${API_IMAGE:?Set API_IMAGE to an immutable API image tag}
    env_file:
      - api.env
    environment:
      NODE_ENV: production
      PORT: '4000'
    networks:
      - churchflow-internal
    ports:
      - 127.0.0.1:4000:4000
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://127.0.0.1:4000/v1/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    <<: *common
    container_name: churchflow-stage-web
    image: ${WEB_IMAGE:?Set WEB_IMAGE to an immutable Web image tag}
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:?Set API_INTERNAL_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      JWT_ACCESS_PUBLIC_KEY: ${JWT_ACCESS_PUBLIC_KEY:?Set JWT_ACCESS_PUBLIC_KEY}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:?Set NEXT_PUBLIC_WEB_URL}
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
    networks:
      - churchflow-internal
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://127.0.0.1:3000/'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  churchflow-internal:
    external: true
    name: churchflow-internal
