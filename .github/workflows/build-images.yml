name: Build deployment images

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or commit SHA to build
        required: true
        default: stage
        type: string
      environment:
        description: Environment configuration to use
        required: true
        default: stage
        type: choice
        options:
          - stage
          - production

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve selected version
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Restrict production sources
        if: inputs.environment == 'production'
        shell: bash
        run: |
          if [[ "${{ inputs.git_ref }}" != "main" && "${{ inputs.git_ref }}" != v* ]]; then
            echo "Production images can only be built from main or a v* tag."
            exit 1
          fi

      - name: Check out selected version
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Record exact commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.application }}
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        application:
          - api
          - api-migrator
          - web
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Web build environment
        if: matrix.application == 'web'
        shell: bash
        env:
          NEXT_PUBLIC_WEB_URL: ${{ vars.NEXT_PUBLIC_WEB_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          API_INTERNAL_URL: ${{ vars.API_INTERNAL_URL }}
          JWT_ACCESS_PUBLIC_KEY: ${{ secrets.JWT_ACCESS_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          invalid=0

          require_url() {
            local key="$1"
            local value="${!key-}"
            if [[ -z "$value" ]]; then
              echo "$key is required for the Web image build."
              invalid=1
              return
            fi
            if ! KEY="$key" VALUE="$value" node -e "new URL(process.env.VALUE)" >/dev/null 2>&1; then
              echo "$key must be a valid URL."
              invalid=1
            fi
          }

          require_url NEXT_PUBLIC_WEB_URL
          require_url NEXT_PUBLIC_API_URL
          require_url API_INTERNAL_URL

          if ! node <<'NODE'; then
          const { createPublicKey } = require('node:crypto');

          function normalizePem(value) {
            let normalized = value.trim();
            const quote = normalized[0];
            if ((quote === '"' || quote === "'") && normalized.endsWith(quote)) {
              normalized = normalized.slice(1, -1).trim();
            }
            normalized = normalized.replace(/\\+n/g, '\n').replace(/\r\n?/g, '\n').trim();
            return `${normalized}\n`;
          }

          const value = process.env.JWT_ACCESS_PUBLIC_KEY || '';
          if (!value) {
            console.error('JWT_ACCESS_PUBLIC_KEY is required for the Web image build.');
            process.exit(1);
          }

          try {
            const normalized = normalizePem(value);
            if (!normalized.includes('-----BEGIN PUBLIC KEY-----')) {
              throw new Error('missing public key header');
            }
            createPublicKey(normalized);
          } catch {
            console.error('JWT_ACCESS_PUBLIC_KEY must be an importable PEM public key.');
            process.exit(1);
          }
          NODE
            invalid=1
          fi

          exit "$invalid"

      - name: Build and publish API image
        if: matrix.application == 'api'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/churchflow-api:${{ needs.resolve.outputs.commit_sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and publish API migrator image
        if: matrix.application == 'api-migrator'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrator
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/churchflow-api-migrator:${{ needs.resolve.outputs.commit_sha }}
          cache-from: type=gha,scope=api-migrator
          cache-to: type=gha,mode=max,scope=api-migrator

      - name: Build and publish Web image
        if: matrix.application == 'web'
        uses: docker/build-push-action@v6
        env:
          JWT_ACCESS_PUBLIC_KEY: ${{ secrets.JWT_ACCESS_PUBLIC_KEY }}
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/churchflow-web:${{ needs.resolve.outputs.commit_sha }}
          build-args: |
            NEXT_PUBLIC_WEB_URL=${{ vars.NEXT_PUBLIC_WEB_URL }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            API_INTERNAL_URL=${{ vars.API_INTERNAL_URL }}
          secret-envs: |
            jwt_access_public_key=JWT_ACCESS_PUBLIC_KEY
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
