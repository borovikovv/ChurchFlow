name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy
        required: true
        type: choice
        options:
          - stage
          - prod

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  COMMIT_SHA: ${{ github.sha }}
  IMAGE_TAG: ${{ inputs.environment }}-${{ github.sha }}
  API_IMAGE: ghcr.io/borovikovv/churchflow-api:${{ inputs.environment }}-${{ github.sha }}
  MIGRATOR_IMAGE: ghcr.io/borovikovv/churchflow-api-migrator:${{ inputs.environment }}-${{ github.sha }}
  WEB_IMAGE: ghcr.io/borovikovv/churchflow-web:${{ inputs.environment }}-${{ github.sha }}
  INTERNAL_NETWORK: churchflow-internal

jobs:
  build:
    name: Build and publish images
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    env:
      TELEGRAM_CLIENT_ID: ${{ vars.TELEGRAM_CLIENT_ID }}
    steps:
      - name: Check out selected commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate selected commit
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "github.sha must be a full 40-character Git commit SHA."
            exit 1
          fi

          echo "Building immutable images for ${{ inputs.environment }} commit $COMMIT_SHA with tag $IMAGE_TAG."

      - name: Validate deployment branch
        shell: bash
        run: |
          set -euo pipefail

          case "${{ inputs.environment }}" in
            stage)
              expected_branch="stage"
              ;;
            prod)
              expected_branch="main"
              ;;
            *)
              echo "Unsupported environment."
              exit 1
              ;;
          esac

          if [[ "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF_NAME" != "$expected_branch" ]]; then
            echo "::error::${{ inputs.environment }} deploys must be dispatched from the $expected_branch branch. Current ref: $GITHUB_REF_TYPE/$GITHUB_REF_NAME."
            exit 1
          fi

      - name: Validate Telegram environment variables
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_CLIENT_ID:-}" ]; then
            echo "::error::TELEGRAM_CLIENT_ID is missing in GitHub Environment variables for the selected environment."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Web build environment
        shell: bash
        env:
          NEXT_PUBLIC_WEB_URL: ${{ vars.NEXT_PUBLIC_WEB_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          API_INTERNAL_URL: ${{ vars.API_INTERNAL_URL }}
          JWT_ACCESS_PUBLIC_KEY: ${{ secrets.JWT_ACCESS_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          invalid=0

          require_url() {
            local key="$1"
            local value="${!key-}"
            if [[ -z "$value" ]]; then
              echo "$key is required for the Web image build."
              invalid=1
              return
            fi
            if [[ "$value" =~ [[:space:]] ]]; then
              echo "$key must be a valid URL without whitespace."
              invalid=1
              return
            fi
            if ! VALUE="$value" node -e "new URL(process.env.VALUE)" >/dev/null 2>&1; then
              echo "$key must be a valid URL."
              invalid=1
            fi
          }

          require_url NEXT_PUBLIC_WEB_URL
          require_url NEXT_PUBLIC_API_URL
          require_url API_INTERNAL_URL

          if ! node <<'NODE'; then
          const { createPublicKey } = require('node:crypto');

          function normalizePem(value) {
            let normalized = value.trim();
            const quote = normalized[0];
            if ((quote === '"' || quote === "'") && normalized.endsWith(quote)) {
              normalized = normalized.slice(1, -1).trim();
            }
            normalized = normalized.replace(/\\+n/g, '\n').replace(/\r\n?/g, '\n').trim();
            return `${normalized}\n`;
          }

          const value = process.env.JWT_ACCESS_PUBLIC_KEY || '';
          if (!value) {
            console.error('JWT_ACCESS_PUBLIC_KEY is required for the Web image build.');
            process.exit(1);
          }

          try {
            const normalized = normalizePem(value);
            if (!normalized.includes('-----BEGIN PUBLIC KEY-----')) {
              throw new Error('missing public key header');
            }
            createPublicKey(normalized);
          } catch {
            console.error('JWT_ACCESS_PUBLIC_KEY must be an importable PEM public key.');
            process.exit(1);
          }
          NODE
            invalid=1
          fi

          exit "$invalid"

      - name: Build and publish API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}
            ${{ env.MIGRATOR_IMAGE }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and publish Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}
          build-args: |
            NEXT_PUBLIC_WEB_URL=${{ vars.NEXT_PUBLIC_WEB_URL }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            API_INTERNAL_URL=${{ vars.API_INTERNAL_URL }}
            JWT_ACCESS_PUBLIC_KEY=${{ secrets.JWT_ACCESS_PUBLIC_KEY }}
          cache-from: type=gha,scope=web-${{ inputs.environment }}
          cache-to: type=gha,mode=max,scope=web-${{ inputs.environment }}

      - name: Build summary
        shell: bash
        run: |
          {
            echo "### Published images"
            echo ""
            echo "- Commit SHA: \`${COMMIT_SHA}\`"
            echo "- Image tag: \`${IMAGE_TAG}\`"
            echo "- API image: \`${API_IMAGE}\`"
            echo "- Migrator image: \`${MIGRATOR_IMAGE}\`"
            echo "- Web image: \`${WEB_IMAGE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy ${{ inputs.environment }} to Hetzner
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ inputs.environment }}
    env:
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TELEGRAM_CLIENT_ID: ${{ vars.TELEGRAM_CLIENT_ID }}
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve deployment settings
        id: settings
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "github.sha must be a full 40-character Git commit SHA."
            exit 1
          fi

          case "${{ inputs.environment }}" in
            stage)
              deploy_env="stage"
              deploy_dir="/opt/churchflow/stage"
              api_host_port="4000"
              web_host_port="3000"
              ;;
            prod)
              deploy_env="prod"
              deploy_dir="/opt/churchflow/prod"
              api_host_port="4100"
              web_host_port="3100"
              ;;
            *)
              echo "Unsupported environment."
              exit 1
              ;;
          esac

          {
            echo "DEPLOY_ENV=$deploy_env"
            echo "DEPLOY_DIR=$deploy_dir"
            echo "API_HOST_PORT=$api_host_port"
            echo "WEB_HOST_PORT=$web_host_port"
            echo "API_CONTAINER_NAME=churchflow-$deploy_env-api"
            echo "WEB_CONTAINER_NAME=churchflow-$deploy_env-web"
            echo "API_NETWORK_ALIAS=churchflow-$deploy_env-api"
            echo "WEB_NETWORK_ALIAS=churchflow-$deploy_env-web"
            echo "MIGRATOR_NETWORK_ALIAS=churchflow-$deploy_env-migrator"
          } >> "$GITHUB_ENV"

          {
            echo "commit_sha=$COMMIT_SHA"
            echo "deploy_env=$deploy_env"
            echo "deploy_dir=$deploy_dir"
          } >> "$GITHUB_OUTPUT"

      - name: Restrict deployments to matching branches
        shell: bash
        run: |
          set -euo pipefail

          case "${{ inputs.environment }}" in
            stage)
              expected_branch="stage"
              ;;
            prod)
              expected_branch="main"
              ;;
            *)
              echo "Unsupported environment."
              exit 1
              ;;
          esac

          if [[ "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF_NAME" != "$expected_branch" ]]; then
            echo "::error::${{ inputs.environment }} deploys must be dispatched from the $expected_branch branch. Current ref: $GITHUB_REF_TYPE/$GITHUB_REF_NAME."
            exit 1
          fi

      - name: Validate deployment environment
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WEB_APP_URL: ${{ vars.WEB_APP_URL }}
          PLATFORM_ADMIN_EMAIL: ${{ vars.PLATFORM_ADMIN_EMAIL }}
          TELEGRAM_CLIENT_SECRET: ${{ secrets.TELEGRAM_CLIENT_SECRET }}
          TELEGRAM_REDIRECT_URI: ${{ vars.TELEGRAM_REDIRECT_URI }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          JWT_ACCESS_PUBLIC_KEY: ${{ secrets.JWT_ACCESS_PUBLIC_KEY }}
          JWT_ACCESS_PRIVATE_KEY: ${{ secrets.JWT_ACCESS_PRIVATE_KEY }}
          JWT_REFRESH_PUBLIC_KEY: ${{ secrets.JWT_REFRESH_PUBLIC_KEY }}
          JWT_REFRESH_PRIVATE_KEY: ${{ secrets.JWT_REFRESH_PRIVATE_KEY }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          NEXT_PUBLIC_WEB_URL: ${{ vars.NEXT_PUBLIC_WEB_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          API_INTERNAL_URL: ${{ vars.API_INTERNAL_URL }}
        run: |
          set -euo pipefail

          invalid=0
          require_value() {
            local key="$1"
            if [[ -z "${!key-}" ]]; then
              echo "$key is required for deployment."
              invalid=1
            fi
          }

          require_url() {
            local key="$1"
            local value="${!key-}"
            if [[ -z "$value" ]]; then
              echo "$key is required for deployment."
              invalid=1
              return
            fi
            if [[ "$value" =~ [[:space:]] ]]; then
              echo "$key must be a valid URL without whitespace."
              invalid=1
              return
            fi
            if ! VALUE="$value" node -e "new URL(process.env.VALUE)" >/dev/null 2>&1; then
              echo "$key must be a valid URL."
              invalid=1
            fi
          }

          if [ -z "${TELEGRAM_CLIENT_ID:-}" ]; then
            echo "::error::TELEGRAM_CLIENT_ID is missing in GitHub Environment variables for the selected environment."
            invalid=1
          fi

          for key in \
            SSH_HOST SSH_USER SSH_PRIVATE_KEY DATABASE_URL WEB_APP_URL PLATFORM_ADMIN_EMAIL \
            TELEGRAM_CLIENT_SECRET TELEGRAM_REDIRECT_URI EMAIL_PROVIDER EMAIL_FROM \
            JWT_ACCESS_PUBLIC_KEY JWT_ACCESS_PRIVATE_KEY JWT_REFRESH_PUBLIC_KEY JWT_REFRESH_PRIVATE_KEY \
            S3_ENDPOINT S3_REGION S3_BUCKET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY \
            NEXT_PUBLIC_WEB_URL NEXT_PUBLIC_API_URL API_INTERNAL_URL; do
            require_value "$key"
          done

          require_url DATABASE_URL
          require_url WEB_APP_URL
          require_url TELEGRAM_REDIRECT_URI
          require_url S3_ENDPOINT
          require_url NEXT_PUBLIC_WEB_URL
          require_url NEXT_PUBLIC_API_URL
          require_url API_INTERNAL_URL

          case "$EMAIL_PROVIDER" in
            resend)
              require_value RESEND_API_KEY
              ;;
            smtp)
              require_value SMTP_HOST
              require_value SMTP_PORT
              ;;
            console)
              ;;
            *)
              echo "EMAIL_PROVIDER must be one of resend, smtp, or console."
              invalid=1
              ;;
          esac

          exit "$invalid"

      - name: Prepare SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/churchflow_deploy
          chmod 600 ~/.ssh/churchflow_deploy

      - name: Render deployment files
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WEB_APP_URL: ${{ vars.WEB_APP_URL }}
          COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}
          PLATFORM_ADMIN_EMAIL: ${{ vars.PLATFORM_ADMIN_EMAIL }}
          TELEGRAM_CLIENT_SECRET: ${{ secrets.TELEGRAM_CLIENT_SECRET }}
          TELEGRAM_REDIRECT_URI: ${{ vars.TELEGRAM_REDIRECT_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_WEBHOOK_URL: ${{ vars.TELEGRAM_WEBHOOK_URL }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          JWT_ACCESS_PUBLIC_KEY: ${{ secrets.JWT_ACCESS_PUBLIC_KEY }}
          JWT_ACCESS_PRIVATE_KEY: ${{ secrets.JWT_ACCESS_PRIVATE_KEY }}
          JWT_REFRESH_PUBLIC_KEY: ${{ secrets.JWT_REFRESH_PUBLIC_KEY }}
          JWT_REFRESH_PRIVATE_KEY: ${{ secrets.JWT_REFRESH_PRIVATE_KEY }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          NEXT_PUBLIC_WEB_URL: ${{ vars.NEXT_PUBLIC_WEB_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          API_INTERNAL_URL: ${{ vars.API_INTERNAL_URL }}
        run: |
          set -euo pipefail
          umask 077

          compose_env_file="$(mktemp)"
          api_env_file="$(mktemp)"
          web_env_file="$(mktemp)"

          append_env_value() {
            local file="$1"
            local key="$2"
            local value="$3"
            value="${value//\\/\\\\}"
            value="${value//$'\n'/\\n}"
            value="${value//\"/\\\"}"
            printf '%s="%s"\n' "$key" "$value" >> "$file"
          }

          append_required_env() {
            local file="$1"
            local key="$2"
            local value="${!key-}"
            if [[ -z "$value" ]]; then
              echo "$key is required for deployment file rendering."
              exit 1
            fi
            append_env_value "$file" "$key" "$value"
          }

          append_optional_env() {
            local file="$1"
            local key="$2"
            local value="${!key-}"
            if [[ -n "$value" ]]; then
              append_env_value "$file" "$key" "$value"
            fi
          }

          BIND_ADDRESS=127.0.0.1

          for key in \
            DEPLOY_ENV COMMIT_SHA IMAGE_TAG API_IMAGE MIGRATOR_IMAGE WEB_IMAGE \
            TELEGRAM_CLIENT_ID BIND_ADDRESS API_HOST_PORT WEB_HOST_PORT INTERNAL_NETWORK \
            API_CONTAINER_NAME WEB_CONTAINER_NAME API_NETWORK_ALIAS WEB_NETWORK_ALIAS MIGRATOR_NETWORK_ALIAS; do
            append_required_env "$compose_env_file" "$key"
          done

          for key in \
            DATABASE_URL WEB_APP_URL PLATFORM_ADMIN_EMAIL \
            TELEGRAM_CLIENT_ID TELEGRAM_CLIENT_SECRET TELEGRAM_REDIRECT_URI \
            EMAIL_PROVIDER EMAIL_FROM \
            JWT_ACCESS_PUBLIC_KEY JWT_ACCESS_PRIVATE_KEY JWT_REFRESH_PUBLIC_KEY JWT_REFRESH_PRIVATE_KEY \
            S3_ENDPOINT S3_REGION S3_BUCKET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            append_required_env "$api_env_file" "$key"
          done

          for key in \
            COOKIE_DOMAIN TELEGRAM_BOT_TOKEN TELEGRAM_BOT_USERNAME TELEGRAM_WEBHOOK_SECRET TELEGRAM_WEBHOOK_URL \
            RESEND_API_KEY SMTP_HOST SMTP_PORT; do
            append_optional_env "$api_env_file" "$key"
          done

          for key in NEXT_PUBLIC_WEB_URL NEXT_PUBLIC_API_URL API_INTERNAL_URL JWT_ACCESS_PUBLIC_KEY; do
            append_required_env "$web_env_file" "$key"
          done

          append_optional_env "$web_env_file" COOKIE_DOMAIN

          {
            echo "compose_env_file=$compose_env_file"
            echo "api_env_file=$api_env_file"
            echo "web_env_file=$web_env_file"
          } >> "$GITHUB_ENV"

      - name: Create remote deployment directory
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/churchflow_deploy -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" \
            "install -d -m 700 '$DEPLOY_DIR'"

      - name: Upload deployment files
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ghcr_token_file="$(mktemp)"
          chmod 600 "$ghcr_token_file"
          printf '%s' "$GHCR_TOKEN" > "$ghcr_token_file"

          scp -i ~/.ssh/churchflow_deploy -o StrictHostKeyChecking=accept-new \
            deploy/compose.yaml \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/compose.yaml"
          scp -i ~/.ssh/churchflow_deploy -o StrictHostKeyChecking=accept-new \
            "$compose_env_file" \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/.env"
          scp -i ~/.ssh/churchflow_deploy -o StrictHostKeyChecking=accept-new \
            "$api_env_file" \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/api.env"
          scp -i ~/.ssh/churchflow_deploy -o StrictHostKeyChecking=accept-new \
            "$web_env_file" \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/web.env"
          scp -i ~/.ssh/churchflow_deploy -o StrictHostKeyChecking=accept-new \
            "$ghcr_token_file" \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/.ghcr-token"

      - name: Deploy over SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          remote_output="$(mktemp)"
          ssh -i ~/.ssh/churchflow_deploy -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" \
            "DEPLOY_DIR='$DEPLOY_DIR' DEPLOY_ENV='$DEPLOY_ENV' GHCR_USERNAME='$GHCR_USERNAME' COMMIT_SHA='$COMMIT_SHA' IMAGE_TAG='$IMAGE_TAG' API_IMAGE='$API_IMAGE' MIGRATOR_IMAGE='$MIGRATOR_IMAGE' WEB_IMAGE='$WEB_IMAGE' INTERNAL_NETWORK='$INTERNAL_NETWORK' API_CONTAINER_NAME='$API_CONTAINER_NAME' WEB_CONTAINER_NAME='$WEB_CONTAINER_NAME' API_HOST_PORT='$API_HOST_PORT' WEB_HOST_PORT='$WEB_HOST_PORT' GITHUB_REF_NAME='$GITHUB_REF_NAME' GITHUB_REF_TYPE='$GITHUB_REF_TYPE' bash -s" <<'REMOTE' | tee "$remote_output"
          set -Eeuo pipefail
          cd "$DEPLOY_DIR"

          docker_config="$(mktemp -d)"
          trap 'rm -f .ghcr-token; rm -rf "$docker_config"' EXIT
          export DOCKER_CONFIG="$docker_config"
          export COMMIT_SHA
          export IMAGE_TAG

          chmod 600 .env api.env web.env .ghcr-token
          docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin < .ghcr-token >/dev/null

          docker network inspect "$INTERNAL_NETWORK" >/dev/null 2>&1 \
            || docker network create "$INTERNAL_NETWORK" >/dev/null

          if ! docker inspect churchflow-postgres >/dev/null 2>&1; then
            echo "Required container churchflow-postgres was not found."
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Networks}}'
            exit 1
          fi

          if ! docker network inspect --format '{{range .Containers}}{{.Name}}{{"\n"}}{{end}}' "$INTERNAL_NETWORK" | grep -Fxq churchflow-postgres; then
            docker network connect "$INTERNAL_NETWORK" churchflow-postgres
          fi

          docker compose --env-file .env -f compose.yaml config >/dev/null
          echo "Pulling deployment images."
          docker compose --env-file .env -f compose.yaml pull api web migrator

          parse_database_url() {
            local output_file="$1"
            docker compose --env-file .env -f compose.yaml --profile migrations run --rm --no-deps --entrypoint node migrator - <<'NODE' > "$output_file"
          const databaseUrl = process.env.DATABASE_URL;
          if (!databaseUrl) {
            console.error('DATABASE_URL is required for backup.');
            process.exit(1);
          }

          const url = new URL(databaseUrl);
          const quote = (value) => `'${String(value).replace(/'/g, "'\\''")}'`;
          const database = decodeURIComponent(url.pathname.replace(/^\//, ''));
          const username = decodeURIComponent(url.username);
          const password = decodeURIComponent(url.password);
          const port = url.port || '5432';

          if (!database || !username) {
            console.error('DATABASE_URL must include database name and username.');
            process.exit(1);
          }

          console.log(`PGDATABASE=${quote(database)}`);
          console.log(`PGUSER=${quote(username)}`);
          console.log(`PGPASSWORD=${quote(password)}`);
          console.log(`PGPORT=${quote(port)}`);
          NODE
          }

          check_pending_migrations_safe_for_prod() {
            if [[ "$DEPLOY_ENV" != "prod" ]]; then
              return 0
            fi

            echo "Checking pending production migrations for destructive SQL."
            docker compose --env-file .env -f compose.yaml --profile migrations run --rm --no-deps \
              --entrypoint node \
              -e DEPLOY_ENV="$DEPLOY_ENV" \
              migrator - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { Client } = require('pg');

          const migrationsDir = path.resolve('packages/db/prisma/migrations');
          const destructivePattern =
            /\b(TRUNCATE|DELETE\s+FROM|DROP\s+TABLE|DROP\s+COLUMN)\b|ALTER\s+TABLE[\s\S]{0,240}\bDROP\b/i;

          async function main() {
            if (!fs.existsSync(migrationsDir)) {
              throw new Error(`Prisma migrations directory was not found: ${migrationsDir}`);
            }

            const migrationNames = fs
              .readdirSync(migrationsDir, { withFileTypes: true })
              .filter((entry) => entry.isDirectory())
              .map((entry) => entry.name)
              .sort();

            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            try {
              const table = await client.query(`
                SELECT to_regclass('public._prisma_migrations') AS table_name
              `);
              const hasMigrationTable = Boolean(table.rows[0]?.table_name);
              const applied = new Set();

              if (hasMigrationTable) {
                const result = await client.query(`
                  SELECT migration_name
                  FROM "_prisma_migrations"
                  WHERE finished_at IS NOT NULL
                    AND rolled_back_at IS NULL
                `);
                for (const row of result.rows) applied.add(row.migration_name);
              }

              const pending = migrationNames.filter((name) => !applied.has(name));
              const destructivePending = pending.filter((name) => {
                const sqlPath = path.join(migrationsDir, name, 'migration.sql');
                if (!fs.existsSync(sqlPath)) return false;
                return destructivePattern.test(fs.readFileSync(sqlPath, 'utf8'));
              });

              if (destructivePending.length > 0) {
                console.error('Production deployment blocked because pending migrations contain potentially destructive SQL:');
                for (const name of destructivePending) console.error(`- ${name}`);
                process.exit(1);
              }

              console.log(`Pending migrations checked: ${pending.length}`);
            } finally {
              await client.end();
            }
          }

          main().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE
          }

          create_database_backup() {
            echo "Creating database backup before migrations."
            local db_env_file
            local backup_dir
            local backup_file
            local timestamp

            db_env_file="$(mktemp)"
            parse_database_url "$db_env_file"
            # shellcheck source=/dev/null
            source "$db_env_file"
            rm -f "$db_env_file"

            if [[ -z "${PGDATABASE+x}" || -z "${PGUSER+x}" || -z "${PGPASSWORD+x}" || -z "${PGPORT+x}" ]]; then
              echo "Could not parse DATABASE_URL for backup."
              exit 1
            fi

            backup_dir="$DEPLOY_DIR/backups"
            install -d -m 700 "$backup_dir"
            timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
            backup_file="$backup_dir/${IMAGE_TAG}-${timestamp}.dump"

            if ! docker exec \
              -e PGPASSWORD="$PGPASSWORD" \
              churchflow-postgres \
              pg_dump -h 127.0.0.1 -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -Fc \
              > "$backup_file"; then
              rm -f "$backup_file"
              echo "Database backup failed."
              exit 1
            fi

            if [[ ! -s "$backup_file" ]]; then
              rm -f "$backup_file"
              echo "Database backup file was not created."
              exit 1
            fi

            chmod 600 "$backup_file"
            echo "Database backup created: $backup_file"
          }

          check_pending_migrations_safe_for_prod
          create_database_backup

          echo "Running database migrations."
          if ! docker compose --env-file .env -f compose.yaml --profile migrations run --rm --no-deps migrator </dev/null; then
            echo "Database migrations failed."
            docker exec churchflow-postgres pg_isready -U churchflow -d churchflow || true
            exit 1
          fi

          echo "Recreating application containers."
          docker compose --env-file .env -f compose.yaml up -d --remove-orphans --force-recreate api web

          require_running_container() {
            local container="$1"
            if ! docker inspect "$container" >/dev/null 2>&1; then
              echo "Required container $container was not created."
              return 1
            fi

            local state
            state="$(docker inspect --format='{{.State.Status}}' "$container" 2>/dev/null || true)"
            if [[ "$state" != "running" ]]; then
              echo "Required container $container is not running. Current state: ${state:-unknown}."
              return 1
            fi
          }

          wait_for_healthy() {
            local container="$1"
            local deadline=$((SECONDS + 180))
            local status

            while (( SECONDS < deadline )); do
              status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)"
              if [[ "$status" == "healthy" ]]; then
                return 0
              fi
              if [[ "$status" == "unhealthy" || "$status" == "exited" || "$status" == "dead" ]]; then
                return 1
              fi
              sleep 5
            done

            return 1
          }

          show_safe_diagnostics() {
            docker compose --env-file .env -f compose.yaml ps
            docker compose --env-file .env -f compose.yaml logs --tail=120 api web
          }

          get_health_status() {
            local container="$1"
            docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container"
          }

          get_expected_image() {
            local service="$1"
            docker compose --env-file .env -f compose.yaml config \
              | awk -v service="$service" '
                  $0 == "  " service ":" {
                    in_service = 1
                    next
                  }
                  in_service && /^  [A-Za-z0-9_-]+:/ {
                    in_service = 0
                  }
                  in_service && /^    image:/ {
                    sub(/^    image:[[:space:]]*/, "")
                    print
                    exit
                  }
                '
          }

          if ! require_running_container "$API_CONTAINER_NAME" || ! require_running_container "$WEB_CONTAINER_NAME"; then
            show_safe_diagnostics
            exit 1
          fi

          if ! wait_for_healthy "$API_CONTAINER_NAME" || ! wait_for_healthy "$WEB_CONTAINER_NAME"; then
            show_safe_diagnostics
            exit 1
          fi

          API_HEALTH_STATUS="$(get_health_status "$API_CONTAINER_NAME")"
          WEB_HEALTH_STATUS="$(get_health_status "$WEB_CONTAINER_NAME")"

          if ! curl --fail --silent --show-error "http://127.0.0.1:$API_HOST_PORT/v1/health" >/dev/null; then
            echo "API health endpoint failed."
            show_safe_diagnostics
            exit 1
          fi

          if ! curl --fail --silent --show-error "http://127.0.0.1:$WEB_HOST_PORT/" >/dev/null; then
            echo "Web health endpoint failed."
            show_safe_diagnostics
            exit 1
          fi

          EXPECTED_API_IMAGE="$(get_expected_image api)"
          EXPECTED_WEB_IMAGE="$(get_expected_image web)"
          RUNNING_API_IMAGE="$(
            docker inspect "$API_CONTAINER_NAME" --format '{{.Config.Image}}'
          )"
          RUNNING_WEB_IMAGE="$(
            docker inspect "$WEB_CONTAINER_NAME" --format '{{.Config.Image}}'
          )"

          if [[ -z "$EXPECTED_API_IMAGE" || -z "$EXPECTED_WEB_IMAGE" ]]; then
            echo "Could not resolve expected deployment images from Docker Compose configuration."
            show_safe_diagnostics
            exit 1
          fi

          if [[ "$RUNNING_API_IMAGE" != "$EXPECTED_API_IMAGE" || "$RUNNING_WEB_IMAGE" != "$EXPECTED_WEB_IMAGE" ]]; then
            echo "Deployment image verification failed."
            printf 'Expected API image: %s\n' "$EXPECTED_API_IMAGE"
            printf 'Running API image:  %s\n' "$RUNNING_API_IMAGE"
            printf 'Expected Web image: %s\n' "$EXPECTED_WEB_IMAGE"
            printf 'Running Web image:  %s\n' "$RUNNING_WEB_IMAGE"
            show_safe_diagnostics
            exit 1
          fi

          echo "__CHURCHFLOW_DEPLOYMENT_SUMMARY_BEGIN__"
          {
            echo "### Remote deployment verification"
            echo ""
            echo "- Environment: \`$DEPLOY_ENV\`"
            echo "- Branch/ref: \`$GITHUB_REF_TYPE/$GITHUB_REF_NAME\`"
            echo "- Commit SHA: \`$COMMIT_SHA\`"
            echo "- Image tag: \`$IMAGE_TAG\`"
            echo "- Remote directory: \`$DEPLOY_DIR\`"
            echo "- Migrator image: \`$MIGRATOR_IMAGE\`"
            echo "- Expected API image: \`$EXPECTED_API_IMAGE\`"
            echo "- Running API image: \`$RUNNING_API_IMAGE\`"
            echo "- Expected Web image: \`$EXPECTED_WEB_IMAGE\`"
            echo "- Running Web image: \`$RUNNING_WEB_IMAGE\`"
            echo "- Healthcheck: \`api=$API_HEALTH_STATUS web=$WEB_HEALTH_STATUS\`"
          }
          echo "__CHURCHFLOW_DEPLOYMENT_SUMMARY_END__"

          docker compose --env-file .env -f compose.yaml ps
          REMOTE

          awk '
            /^__CHURCHFLOW_DEPLOYMENT_SUMMARY_BEGIN__$/ {
              capture = 1
              next
            }
            /^__CHURCHFLOW_DEPLOYMENT_SUMMARY_END__$/ {
              capture = 0
              next
            }
            capture {
              print
            }
          ' "$remote_output" > deployment-summary.md

          if [[ ! -s deployment-summary.md ]]; then
            echo "Remote deployment summary was not produced."
            exit 1
          fi

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "### Deployment"
            echo ""
            echo "- GitHub Environment: \`${{ inputs.environment }}\`"
            echo "- Deployment environment: \`${DEPLOY_ENV}\`"
            echo "- Commit SHA: \`${COMMIT_SHA}\`"
            echo "- Image tag: \`${IMAGE_TAG}\`"
            echo "- API image: \`${API_IMAGE}\`"
            echo "- Migrator image: \`${MIGRATOR_IMAGE}\`"
            echo "- Web image: \`${WEB_IMAGE}\`"
            echo "- Remote directory: \`${DEPLOY_DIR}\`"
            echo ""
            cat deployment-summary.md
          } >> "$GITHUB_STEP_SUMMARY"
