name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy
        required: true
        default: stage
        type: choice
        options:
          - stage
          - production

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }} to Hetzner
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    env:
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
      INTERNAL_NETWORK: churchflow-internal
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve deployment settings
        id: settings
        shell: bash
        run: |
          set -euo pipefail

          raw_tag="${{ github.sha }}"
          if [[ ! "$raw_tag" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "github.sha must be a full 40-character Git commit SHA."
            exit 1
          fi

          commit_sha="$(printf '%s' "$raw_tag" | tr '[:upper:]' '[:lower:]')"
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"

          case "${{ inputs.environment }}" in
            stage)
              deploy_dir="/opt/churchflow/stage"
              api_host_port="4000"
              web_host_port="3000"
              ;;
            production)
              deploy_dir="/opt/churchflow/production"
              api_host_port="4100"
              web_host_port="3100"
              ;;
            *)
              echo "Unsupported environment."
              exit 1
              ;;
          esac

          deploy_env="${{ inputs.environment }}"

          {
            echo "IMAGE_TAG=$commit_sha"
            echo "DEPLOY_ENV=$deploy_env"
            echo "DEPLOY_DIR=$deploy_dir"
            echo "API_HOST_PORT=$api_host_port"
            echo "WEB_HOST_PORT=$web_host_port"
            echo "API_IMAGE=ghcr.io/$owner/churchflow-api:$commit_sha"
            echo "MIGRATOR_IMAGE=ghcr.io/$owner/churchflow-api-migrator:$commit_sha"
            echo "WEB_IMAGE=ghcr.io/$owner/churchflow-web:$commit_sha"
            echo "API_CONTAINER_NAME=churchflow-$deploy_env-api"
            echo "WEB_CONTAINER_NAME=churchflow-$deploy_env-web"
            echo "API_NETWORK_ALIAS=churchflow-$deploy_env-api"
            echo "WEB_NETWORK_ALIAS=churchflow-$deploy_env-web"
            echo "MIGRATOR_NETWORK_ALIAS=churchflow-$deploy_env-migrator"
          } >> "$GITHUB_ENV"

          {
            echo "commit_sha=$commit_sha"
            echo "deploy_env=$deploy_env"
            echo "deploy_dir=$deploy_dir"
          } >> "$GITHUB_OUTPUT"

      - name: Restrict production image tags
        if: inputs.environment == 'production'
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force origin main:refs/remotes/origin/main
          git fetch --force origin 'refs/tags/v*:refs/tags/v*'

          if git merge-base --is-ancestor "$IMAGE_TAG" refs/remotes/origin/main; then
            exit 0
          fi

          if git for-each-ref --format='%(refname:short) %(objectname) %(*objectname)' refs/tags/v* \
            | awk -v sha="$IMAGE_TAG" '$2 == sha || $3 == sha { found = 1 } END { exit found ? 0 : 1 }'; then
            exit 0
          fi

          echo "Production deploys require github.sha to be reachable from main or matching a v* release tag."
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for image verification
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_TOKEN }}

      - name: Verify images exist
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          for image in "$API_IMAGE" "$MIGRATOR_IMAGE" "$WEB_IMAGE"; do
            if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "Found image: $image"
            else
              echo "Required image was not found in GHCR: $image"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "One or more required GHCR images for commit ${IMAGE_TAG} are missing. Run build-images.yml for this commit before deploying."
            exit 1
          fi

      - name: Validate deployment environment
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WEB_APP_URL: ${{ vars.WEB_APP_URL }}
          PLATFORM_ADMIN_EMAIL: ${{ vars.PLATFORM_ADMIN_EMAIL }}
          TELEGRAM_CLIENT_ID: ${{ secrets.TELEGRAM_CLIENT_ID }}
          TELEGRAM_CLIENT_SECRET: ${{ secrets.TELEGRAM_CLIENT_SECRET }}
          TELEGRAM_REDIRECT_URI: ${{ vars.TELEGRAM_REDIRECT_URI }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          JWT_ACCESS_PUBLIC_KEY: ${{ secrets.JWT_ACCESS_PUBLIC_KEY }}
          JWT_ACCESS_PRIVATE_KEY: ${{ secrets.JWT_ACCESS_PRIVATE_KEY }}
          JWT_REFRESH_PUBLIC_KEY: ${{ secrets.JWT_REFRESH_PUBLIC_KEY }}
          JWT_REFRESH_PRIVATE_KEY: ${{ secrets.JWT_REFRESH_PRIVATE_KEY }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          NEXT_PUBLIC_WEB_URL: ${{ vars.NEXT_PUBLIC_WEB_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          API_INTERNAL_URL: ${{ vars.API_INTERNAL_URL }}
        run: |
          set -euo pipefail

          invalid=0
          require_value() {
            local key="$1"
            if [[ -z "${!key-}" ]]; then
              echo "$key is required for deployment."
              invalid=1
            fi
          }

          require_url() {
            local key="$1"
            local value="${!key-}"
            if [[ -z "$value" ]]; then
              echo "$key is required for deployment."
              invalid=1
              return
            fi
            if [[ "$value" =~ [[:space:]] ]]; then
              echo "$key must be a valid URL without whitespace."
              invalid=1
              return
            fi
            if ! VALUE="$value" node -e "new URL(process.env.VALUE)" >/dev/null 2>&1; then
              echo "$key must be a valid URL."
              invalid=1
            fi
          }

          for key in \
            SSH_HOST SSH_USER SSH_PRIVATE_KEY DATABASE_URL WEB_APP_URL PLATFORM_ADMIN_EMAIL \
            TELEGRAM_CLIENT_ID TELEGRAM_CLIENT_SECRET TELEGRAM_REDIRECT_URI EMAIL_PROVIDER EMAIL_FROM \
            JWT_ACCESS_PUBLIC_KEY JWT_ACCESS_PRIVATE_KEY JWT_REFRESH_PUBLIC_KEY JWT_REFRESH_PRIVATE_KEY \
            S3_ENDPOINT S3_REGION S3_BUCKET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY \
            NEXT_PUBLIC_WEB_URL NEXT_PUBLIC_API_URL API_INTERNAL_URL; do
            require_value "$key"
          done

          require_url DATABASE_URL
          require_url WEB_APP_URL
          require_url TELEGRAM_REDIRECT_URI
          require_url S3_ENDPOINT
          require_url NEXT_PUBLIC_WEB_URL
          require_url NEXT_PUBLIC_API_URL
          require_url API_INTERNAL_URL

          case "$EMAIL_PROVIDER" in
            resend)
              require_value RESEND_API_KEY
              ;;
            smtp)
              require_value SMTP_HOST
              require_value SMTP_PORT
              ;;
            console)
              ;;
            *)
              echo "EMAIL_PROVIDER must be one of resend, smtp, or console."
              invalid=1
              ;;
          esac

          exit "$invalid"

      - name: Prepare SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/churchflow_deploy
          chmod 600 ~/.ssh/churchflow_deploy

      - name: Render deployment files
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WEB_APP_URL: ${{ vars.WEB_APP_URL }}
          COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}
          PLATFORM_ADMIN_EMAIL: ${{ vars.PLATFORM_ADMIN_EMAIL }}
          TELEGRAM_CLIENT_ID: ${{ secrets.TELEGRAM_CLIENT_ID }}
          TELEGRAM_CLIENT_SECRET: ${{ secrets.TELEGRAM_CLIENT_SECRET }}
          TELEGRAM_REDIRECT_URI: ${{ vars.TELEGRAM_REDIRECT_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_WEBHOOK_URL: ${{ vars.TELEGRAM_WEBHOOK_URL }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          JWT_ACCESS_PUBLIC_KEY: ${{ secrets.JWT_ACCESS_PUBLIC_KEY }}
          JWT_ACCESS_PRIVATE_KEY: ${{ secrets.JWT_ACCESS_PRIVATE_KEY }}
          JWT_REFRESH_PUBLIC_KEY: ${{ secrets.JWT_REFRESH_PUBLIC_KEY }}
          JWT_REFRESH_PRIVATE_KEY: ${{ secrets.JWT_REFRESH_PRIVATE_KEY }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          NEXT_PUBLIC_WEB_URL: ${{ vars.NEXT_PUBLIC_WEB_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          API_INTERNAL_URL: ${{ vars.API_INTERNAL_URL }}
        run: |
          set -euo pipefail
          umask 077

          compose_env_file="$(mktemp)"
          api_env_file="$(mktemp)"
          web_env_file="$(mktemp)"

          append_env() {
            local file="$1"
            local key="$2"
            local value="${!key-}"
            value="${value//\\/\\\\}"
            value="${value//$'\n'/\\n}"
            value="${value//\"/\\\"}"
            printf '%s="%s"\n' "$key" "$value" >> "$file"
          }

          for key in \
            DEPLOY_ENV IMAGE_TAG API_IMAGE MIGRATOR_IMAGE WEB_IMAGE \
            BIND_ADDRESS API_HOST_PORT WEB_HOST_PORT INTERNAL_NETWORK \
            API_CONTAINER_NAME WEB_CONTAINER_NAME API_NETWORK_ALIAS WEB_NETWORK_ALIAS MIGRATOR_NETWORK_ALIAS; do
            if [[ "$key" == "BIND_ADDRESS" ]]; then
              BIND_ADDRESS=127.0.0.1
            fi
            append_env "$compose_env_file" "$key"
          done

          for key in \
            DATABASE_URL WEB_APP_URL COOKIE_DOMAIN PLATFORM_ADMIN_EMAIL \
            TELEGRAM_CLIENT_ID TELEGRAM_CLIENT_SECRET TELEGRAM_REDIRECT_URI \
            TELEGRAM_BOT_TOKEN TELEGRAM_BOT_USERNAME TELEGRAM_WEBHOOK_SECRET TELEGRAM_WEBHOOK_URL \
            EMAIL_PROVIDER EMAIL_FROM RESEND_API_KEY SMTP_HOST SMTP_PORT \
            JWT_ACCESS_PUBLIC_KEY JWT_ACCESS_PRIVATE_KEY JWT_REFRESH_PUBLIC_KEY JWT_REFRESH_PRIVATE_KEY \
            S3_ENDPOINT S3_REGION S3_BUCKET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            append_env "$api_env_file" "$key"
          done

          for key in \
            NEXT_PUBLIC_WEB_URL NEXT_PUBLIC_API_URL API_INTERNAL_URL COOKIE_DOMAIN JWT_ACCESS_PUBLIC_KEY; do
            append_env "$web_env_file" "$key"
          done

          {
            echo "compose_env_file=$compose_env_file"
            echo "api_env_file=$api_env_file"
            echo "web_env_file=$web_env_file"
          } >> "$GITHUB_ENV"

      - name: Create remote deployment directory
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/churchflow_deploy -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" \
            "install -d -m 700 '$DEPLOY_DIR'"

      - name: Upload deployment files
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ghcr_token_file="$(mktemp)"
          chmod 600 "$ghcr_token_file"
          printf '%s' "$GHCR_TOKEN" > "$ghcr_token_file"

          scp -i ~/.ssh/churchflow_deploy -o StrictHostKeyChecking=accept-new \
            deploy/compose.yaml \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/compose.yaml"
          scp -i ~/.ssh/churchflow_deploy -o StrictHostKeyChecking=accept-new \
            "$compose_env_file" \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/.env"
          scp -i ~/.ssh/churchflow_deploy -o StrictHostKeyChecking=accept-new \
            "$api_env_file" \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/api.env"
          scp -i ~/.ssh/churchflow_deploy -o StrictHostKeyChecking=accept-new \
            "$web_env_file" \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/web.env"
          scp -i ~/.ssh/churchflow_deploy -o StrictHostKeyChecking=accept-new \
            "$ghcr_token_file" \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/.ghcr-token"

      - name: Deploy over SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/churchflow_deploy -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" \
            "DEPLOY_DIR='$DEPLOY_DIR' GHCR_USERNAME='$GHCR_USERNAME' INTERNAL_NETWORK='$INTERNAL_NETWORK' API_CONTAINER_NAME='$API_CONTAINER_NAME' WEB_CONTAINER_NAME='$WEB_CONTAINER_NAME' API_HOST_PORT='$API_HOST_PORT' WEB_HOST_PORT='$WEB_HOST_PORT' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_DIR"

          docker_config="$(mktemp -d)"
          trap 'rm -f .ghcr-token; rm -rf "$docker_config"' EXIT
          export DOCKER_CONFIG="$docker_config"

          chmod 600 .env api.env web.env .ghcr-token
          docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin < .ghcr-token >/dev/null

          docker network inspect "$INTERNAL_NETWORK" >/dev/null 2>&1 \
            || docker network create "$INTERNAL_NETWORK" >/dev/null

          if ! docker inspect churchflow-postgres >/dev/null 2>&1; then
            echo "Required container churchflow-postgres was not found."
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Networks}}'
            exit 1
          fi

          if ! docker network inspect --format '{{range .Containers}}{{.Name}}{{"\n"}}{{end}}' "$INTERNAL_NETWORK" | grep -Fxq churchflow-postgres; then
            docker network connect "$INTERNAL_NETWORK" churchflow-postgres
          fi

          docker compose --env-file .env -f compose.yaml config >/dev/null
          docker compose --env-file .env -f compose.yaml pull api web migrator

          if ! docker compose --env-file .env -f compose.yaml --profile migrations run --rm --no-deps migrator; then
            echo "Database migrations failed."
            docker exec churchflow-postgres pg_isready -U churchflow -d churchflow || true
            exit 1
          fi

          docker compose --env-file .env -f compose.yaml up -d --remove-orphans api web

          wait_for_healthy() {
            local container="$1"
            local deadline=$((SECONDS + 180))

            while (( SECONDS < deadline )); do
              status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)"
              if [[ "$status" == "healthy" ]]; then
                return 0
              fi
              if [[ "$status" == "unhealthy" || "$status" == "exited" || "$status" == "dead" ]]; then
                return 1
              fi
              sleep 5
            done

            return 1
          }

          if ! wait_for_healthy "$API_CONTAINER_NAME" || ! wait_for_healthy "$WEB_CONTAINER_NAME"; then
            docker compose --env-file .env -f compose.yaml ps
            docker compose --env-file .env -f compose.yaml logs --tail=120 api web
            exit 1
          fi

          curl --fail --silent --show-error "http://127.0.0.1:$API_HOST_PORT/v1/health" >/dev/null
          curl --fail --silent --show-error "http://127.0.0.1:$WEB_HOST_PORT/" >/dev/null
          docker compose --env-file .env -f compose.yaml ps
          REMOTE

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "### Deployment"
            echo ""
            echo "- Environment: \`${DEPLOY_ENV}\`"
            echo "- Image tag: \`${IMAGE_TAG}\`"
            echo "- API image: \`${API_IMAGE}\`"
            echo "- Migrator image: \`${MIGRATOR_IMAGE}\`"
            echo "- Web image: \`${WEB_IMAGE}\`"
            echo "- Remote directory: \`${DEPLOY_DIR}\`"
          } >> "$GITHUB_STEP_SUMMARY"
