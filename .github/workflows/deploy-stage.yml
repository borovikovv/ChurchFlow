name: Deploy stage

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag to deploy, usually a commit SHA built by build-images.yml
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-stage
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy stage to Hetzner
    runs-on: ubuntu-latest
    environment: stage
    env:
      DEPLOY_DIR: /opt/churchflow/stage
      INTERNAL_NETWORK: churchflow-internal
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.STAGE_GHCR_TOKEN || github.token }}
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v4

      - name: Validate selected tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          raw_tag="${{ inputs.image_tag }}"
          if [[ ! "$raw_tag" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "image_tag must be a full 40-character Git commit SHA."
            exit 1
          fi
          image_tag="$(printf '%s' "$raw_tag" | tr '[:upper:]' '[:lower:]')"
          {
            echo "image_tag=$image_tag"
            echo "api_image=ghcr.io/${{ github.repository_owner }}/churchflow-api:$image_tag"
            echo "migrator_image=ghcr.io/${{ github.repository_owner }}/churchflow-api-migrator:$image_tag"
            echo "web_image=ghcr.io/${{ github.repository_owner }}/churchflow-web:$image_tag"
          } >> "$GITHUB_OUTPUT"
          {
            echo "IMAGE_TAG=$image_tag"
            echo "API_IMAGE=ghcr.io/${{ github.repository_owner }}/churchflow-api:$image_tag"
            echo "MIGRATOR_IMAGE=ghcr.io/${{ github.repository_owner }}/churchflow-api-migrator:$image_tag"
            echo "WEB_IMAGE=ghcr.io/${{ github.repository_owner }}/churchflow-web:$image_tag"
          } >> "$GITHUB_ENV"

      - name: Log in to GHCR for image verification
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_TOKEN }}

      - name: Verify images exist
        shell: bash
        run: |
          set -euo pipefail
          for image in "$API_IMAGE" "$MIGRATOR_IMAGE" "$WEB_IMAGE"; do
            docker buildx imagetools inspect "$image" >/dev/null
          done

      - name: Prepare SSH key
        shell: bash
        env:
          STAGE_SSH_PRIVATE_KEY: ${{ secrets.STAGE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGE_SSH_PRIVATE_KEY" > ~/.ssh/churchflow_stage
          chmod 600 ~/.ssh/churchflow_stage

      - name: Render stage environment file
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.STAGE_DATABASE_URL }}
          WEB_APP_URL: ${{ vars.WEB_APP_URL }}
          COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}
          PLATFORM_ADMIN_EMAIL: ${{ vars.PLATFORM_ADMIN_EMAIL }}
          TELEGRAM_CLIENT_ID: ${{ secrets.TELEGRAM_CLIENT_ID }}
          TELEGRAM_CLIENT_SECRET: ${{ secrets.TELEGRAM_CLIENT_SECRET }}
          TELEGRAM_REDIRECT_URI: ${{ vars.TELEGRAM_REDIRECT_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_WEBHOOK_URL: ${{ vars.TELEGRAM_WEBHOOK_URL }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          JWT_ACCESS_PUBLIC_KEY: ${{ secrets.JWT_ACCESS_PUBLIC_KEY }}
          JWT_ACCESS_PRIVATE_KEY: ${{ secrets.JWT_ACCESS_PRIVATE_KEY }}
          JWT_REFRESH_PUBLIC_KEY: ${{ secrets.JWT_REFRESH_PUBLIC_KEY }}
          JWT_REFRESH_PRIVATE_KEY: ${{ secrets.JWT_REFRESH_PRIVATE_KEY }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          NEXT_PUBLIC_WEB_URL: ${{ vars.NEXT_PUBLIC_WEB_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          API_INTERNAL_URL: ${{ vars.API_INTERNAL_URL }}
        run: |
          set -euo pipefail
          umask 077
          compose_env_file="$(mktemp)"
          api_env_file="$(mktemp)"
          append_env() {
            local file="$1"
            local key="$2"
            local value="${!key-}"
            value="${value//\\/\\\\}"
            value="${value//$'\n'/\\n}"
            value="${value//\"/\\\"}"
            printf '%s="%s"\n' "$key" "$value" >> "$file"
          }

          for key in \
            API_IMAGE MIGRATOR_IMAGE WEB_IMAGE \
            NEXT_PUBLIC_WEB_URL NEXT_PUBLIC_API_URL API_INTERNAL_URL COOKIE_DOMAIN JWT_ACCESS_PUBLIC_KEY; do
            append_env "$compose_env_file" "$key"
          done

          for key in \
            DATABASE_URL WEB_APP_URL COOKIE_DOMAIN PLATFORM_ADMIN_EMAIL \
            TELEGRAM_CLIENT_ID TELEGRAM_CLIENT_SECRET TELEGRAM_REDIRECT_URI \
            TELEGRAM_BOT_TOKEN TELEGRAM_BOT_USERNAME TELEGRAM_WEBHOOK_SECRET TELEGRAM_WEBHOOK_URL \
            EMAIL_PROVIDER EMAIL_FROM RESEND_API_KEY SMTP_HOST SMTP_PORT \
            JWT_ACCESS_PUBLIC_KEY JWT_ACCESS_PRIVATE_KEY JWT_REFRESH_PUBLIC_KEY JWT_REFRESH_PRIVATE_KEY \
            S3_ENDPOINT S3_REGION S3_BUCKET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            append_env "$api_env_file" "$key"
          done

          {
            echo "compose_env_file=$compose_env_file"
            echo "api_env_file=$api_env_file"
          } >> "$GITHUB_ENV"

      - name: Create remote deployment directory
        shell: bash
        env:
          STAGE_SSH_HOST: ${{ secrets.STAGE_SSH_HOST }}
          STAGE_SSH_USER: ${{ secrets.STAGE_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/churchflow_stage -o StrictHostKeyChecking=accept-new \
            "$STAGE_SSH_USER@$STAGE_SSH_HOST" \
            "install -d -m 700 '$DEPLOY_DIR'"

      - name: Upload deployment files
        shell: bash
        env:
          STAGE_SSH_HOST: ${{ secrets.STAGE_SSH_HOST }}
          STAGE_SSH_USER: ${{ secrets.STAGE_SSH_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/churchflow_stage -o StrictHostKeyChecking=accept-new \
            deploy/stage/compose.yaml \
            "$STAGE_SSH_USER@$STAGE_SSH_HOST:$DEPLOY_DIR/compose.yaml"
          scp -i ~/.ssh/churchflow_stage -o StrictHostKeyChecking=accept-new \
            "$compose_env_file" \
            "$STAGE_SSH_USER@$STAGE_SSH_HOST:$DEPLOY_DIR/.env"
          scp -i ~/.ssh/churchflow_stage -o StrictHostKeyChecking=accept-new \
            "$api_env_file" \
            "$STAGE_SSH_USER@$STAGE_SSH_HOST:$DEPLOY_DIR/api.env"
          ghcr_token_file="$(mktemp)"
          chmod 600 "$ghcr_token_file"
          printf '%s' "$GHCR_TOKEN" > "$ghcr_token_file"
          scp -i ~/.ssh/churchflow_stage -o StrictHostKeyChecking=accept-new \
            "$ghcr_token_file" \
            "$STAGE_SSH_USER@$STAGE_SSH_HOST:$DEPLOY_DIR/.ghcr-token"

      - name: Deploy over SSH
        shell: bash
        env:
          STAGE_SSH_HOST: ${{ secrets.STAGE_SSH_HOST }}
          STAGE_SSH_USER: ${{ secrets.STAGE_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/churchflow_stage -o StrictHostKeyChecking=accept-new \
            "$STAGE_SSH_USER@$STAGE_SSH_HOST" \
            "DEPLOY_DIR='$DEPLOY_DIR' GHCR_USERNAME='$GHCR_USERNAME' MIGRATOR_IMAGE='$MIGRATOR_IMAGE' INTERNAL_NETWORK='$INTERNAL_NETWORK' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_DIR"
          docker_config="$(mktemp -d)"
          trap 'rm -f .ghcr-token; rm -rf "$docker_config"' EXIT
          export DOCKER_CONFIG="$docker_config"
          chmod 600 .env
          chmod 600 api.env
          chmod 600 .ghcr-token

          docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin < .ghcr-token >/dev/null

          docker network inspect "$INTERNAL_NETWORK" >/dev/null 2>&1 \
            || docker network create "$INTERNAL_NETWORK" >/dev/null

          if ! docker inspect churchflow-postgres >/dev/null 2>&1; then
            echo "Required container churchflow-postgres was not found."
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Networks}}'
            exit 1
          fi

          if ! docker network inspect --format '{{range .Containers}}{{.Name}}{{"\n"}}{{end}}' "$INTERNAL_NETWORK" | grep -Fxq churchflow-postgres; then
            docker network connect "$INTERNAL_NETWORK" churchflow-postgres
          fi

          docker compose --env-file .env -f compose.yaml config >/dev/null
          docker compose --env-file .env -f compose.yaml pull
          docker pull "$MIGRATOR_IMAGE" >/dev/null

          if ! docker run --rm \
            --init \
            --network "$INTERNAL_NETWORK" \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env-file api.env \
            "$MIGRATOR_IMAGE"; then
            echo "Database migrations failed."
            docker network inspect --format '{{range .Containers}}{{.Name}}{{"\n"}}{{end}}' "$INTERNAL_NETWORK" || true
            docker exec churchflow-postgres pg_isready -U churchflow -d churchflow || true
            exit 1
          fi

          docker compose --env-file .env -f compose.yaml up -d

          wait_for_healthy() {
            local container="$1"
            local deadline=$((SECONDS + 180))

            while (( SECONDS < deadline )); do
              status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)"
              if [[ "$status" == "healthy" ]]; then
                return 0
              fi
              if [[ "$status" == "unhealthy" || "$status" == "exited" || "$status" == "dead" ]]; then
                return 1
              fi
              sleep 5
            done

            return 1
          }

          if ! wait_for_healthy churchflow-stage-api || ! wait_for_healthy churchflow-stage-web; then
            docker compose --env-file .env -f compose.yaml ps
            docker compose --env-file .env -f compose.yaml logs --tail=120 api web
            docker network inspect --format '{{range .Containers}}{{.Name}}{{"\n"}}{{end}}' "$INTERNAL_NETWORK" || true
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:4000/v1/health >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
          docker compose --env-file .env -f compose.yaml ps
          REMOTE
