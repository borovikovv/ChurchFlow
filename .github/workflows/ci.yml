name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - stage

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    env:
      # next build runs with NODE_ENV=production, and webEnvSchema then demands these
      # three. The values only have to parse as URLs: this build exists to run the
      # tests and is thrown away. Deployable images are built by deploy.yml with the
      # real environment.
      NEXT_PUBLIC_WEB_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      API_INTERNAL_URL: http://localhost:3001
    steps:
      - name: Check out the commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
